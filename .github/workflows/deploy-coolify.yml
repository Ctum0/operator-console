name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Restart the service on Coolify (rebuilds from main)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN secret is not set"; exit 1
          fi
          URL=https://coolify.ctum.org/api/v1/services/5pjvhg3rjdgcifotuhfgvssg/restart
          CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" -H "User-Agent: curl/8.5.0" "$URL")
          if grep -q "Just a moment" /tmp/resp.txt 2>/dev/null; then
            echo "Blocked by Cloudflare's bot challenge (HTTP $CODE). Add a WAF skip rule for coolify.ctum.org /api/v1/ and console.ctum.org /healthz."
            exit 1
          fi
          echo "restart request: HTTP $CODE"; head -c 300 /tmp/resp.txt; echo
          case "$CODE" in 2*) ;; *) exit 1;; esac

      - name: Wait for the console to come back healthy
        run: |
          set -uo pipefail
          sleep 180
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.txt -w '%{http_code}' -m 10 https://console.ctum.org/healthz)
            if [ "$CODE" = "200" ]; then echo "console healthy"; exit 0; fi
            if grep -q "Just a moment" /tmp/health.txt 2>/dev/null; then
              echo "Blocked by Cloudflare's bot challenge on console.ctum.org"; exit 1
            fi
            sleep 10
          done
          echo "console not healthy after rebuild"; exit 1
