services:
  operator-console:
    container_name: operator-console
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: operator-console:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:?CONSOLE_TOKEN required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      N8N_PROPOSE_WEBHOOK: ${N8N_PROPOSE_WEBHOOK:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      REPO: ${REPO:-Ctum0/detection-platform}
      WAZUH_HOST: ${WAZUH_HOST:-100.81.241.62}
      WAZUH_PORT: ${WAZUH_PORT:-1514}
      WAZUH_API_URL: ${WAZUH_API_URL:-}
      WAZUH_API_USER: ${WAZUH_API_USER:-}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-}
      WAZUH_API_VERIFY_TLS: ${WAZUH_API_VERIFY_TLS:-true}
      COVERAGE_PATH: ${COVERAGE_PATH:-modules/detection-pipeline/docs/attack-matrix.md}
    volumes:
      - console-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  console-data:
